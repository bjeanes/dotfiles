[aliases]
gpa = ["git", "push", "-r", "remote_bookmarks(remote=origin).."]
hunk = ["util", "exec", "--", "jj-hunk-tool"]
mon = ["util", "exec", "--", "sh", "-c", "clear; jj --ignore-working-copy --no-pager --color always log; fswatch -o  `jj root`/.jj | xargs -I{} sh -c 'clear; jj --ignore-working-copy --no-pager --color always log'"]
pin = ["util", "exec", "--", "jj-pin"]
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()", "--simplify-parents", "--skip-emptied"]
stack = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revisions"]
stage = ["stack", "closest_merge(@)+:: ~ empty()"]

[git]
private-commits = "private()"
sign-on-push = true

[remotes.origin]
auto-track-bookmarks = "bjeanes/*"

[revset-aliases]
"closest_merge(to)" = "heads(::to & merges())"
"immutable_heads()" = "builtin_immutable_heads() | pinned()"
"local_private()" = "none()"
"pinned()" = "none()"
"private()" = "( subject(exact-i:'wip') ) | ( subject(glob-i:'wip:*') ) | ( subject(exact-i:'prv') ) | ( subject(glob-i:'prv:*') ) | ( subject(exact-i:'priv') ) | ( subject(glob-i:'priv:*') ) | ( subject(exact-i:'private') ) | ( subject(glob-i:'private:*') ) | ( conflicts() ) | ( empty() ~ (root() | merges()) ) | ( local_private() )"

[revsets]
log = "builtin_log() | (trunk()..bookmarks())"

[signing]
backend = "ssh"
behavior = "drop"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJykg+5TulcwmeKFYSjZmnrL5/Fo4kWmOV1fAyt41Evh"

[template-aliases]
"format_commit_labels(commit)" = """
separate(" ",
  coalesce(
    if(commit.hidden(), label("hidden", "(hidden)")),
    if(commit.divergent(), label("divergent", "(divergent)")),
  ),
  if(commit.conflict(), label("conflict", "(conflict)")),
  coalesce(
    if(commit.contained_in("mutable() & private()"), "🔐"),
    if(commit.contained_in("(mutable() & private())::"), "🔒"),
  ),
)
"""
"format_short_signature(signature)" = '''
if(
  signature.email().domain() == "users.noreply.github.com",
  signature.email().local().replace(regex:"^[0-9]+\\+", "") ++ "@GH",
  if(
    signature.email().local() == "me" ||
      signature.email().local() == "hello" ||
      signature.email().local() == "dev" ||
      signature.email().local() == "git",
    signature.email().domain(),
    signature.email().local() ++ "@"
  )
)
'''
"format_timestamp(timestamp)" = "timestamp.ago()"
"slugify(str)" = '''
truncate_end(
  65,
  str.first_line()
    .replace(regex:"[^[[:alnum:]].]", "-")
    .replace(regex:"-{2,}", "-")
    .replace(regex:"\\.{2,}", ".")
    .replace(regex:"(^-+|-+$)", "")
    .lower()
)
'''

[templates]
git_push_bookmark = """
"bjeanes/" ++ change_id.short() ++ "-" ++ slugify(description)
"""

[ui]
default-command = "log"
diff-formatter = ["difft", "--color=always", "--sort-paths", "--width=$width", "$left", "$right"]

[user]
email = "me@bjeanes.com"
name = "Bo Jeanes"
